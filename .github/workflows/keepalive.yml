name: Keep the API awake

# Free Hugging Face Spaces go to sleep after about two days without visits,
# and the first visitor then waits about a minute. A daily ping avoids that.
# Needs the repository variable API_URL, like "https://your-user-stitchlab-api.hf.space".

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Ping the API
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is not set, nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            "${API_URL%/}/api/v1/health"
