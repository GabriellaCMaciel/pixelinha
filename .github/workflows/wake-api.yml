name: Wake the API

# The free Render plan puts the API to sleep after 15 minutes without visits, and the
# next visitor waits about a minute. Run this workflow by hand (Actions > Wake the API >
# Run workflow) a couple of minutes before showing the project to someone.
# Needs the repository variable API_URL, like "https://pixelinha-api.onrender.com".

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Ping the API
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is not set, nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --max-time 120 \
            "${API_URL%/}/api/v1/health"
