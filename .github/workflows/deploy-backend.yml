name: Deploy back-end

# Sends the backend/ folder to a Hugging Face Space whenever the back-end
# changes on main, creating the Space the first time. Needs, in the repository
# settings (Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN             a Hugging Face access token with write permission
# Optional variables:
#   HF_SPACE              "your-user/name" (default: your-user/pixelinha-api)
#   ALLOWED_ORIGINS       sites allowed to call the API, comma separated
#   ALLOWED_ORIGIN_REGEX  pattern for allowed sites (default: this project's Vercel addresses)
# Without the token the job says so and finishes.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/deploy_space.py"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      ALLOWED_ORIGIN_REGEX: ${{ vars.ALLOWED_ORIGIN_REGEX }}
    steps:
      - name: Check the settings
        id: check
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "The HF_TOKEN secret is not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Create the Space if needed and upload backend/
        if: steps.check.outputs.ready == 'true'
        run: |
          pip install --quiet huggingface_hub
          python .github/scripts/deploy_space.py
