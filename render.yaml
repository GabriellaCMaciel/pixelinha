# Blueprint for Render (https://render.com): creates the API as a free Docker web service.
# Render rebuilds it on every push to main that touches backend/.
services:
  - type: web
    name: pixelinha-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Sites allowed to call the API from a browser: this project's Vercel addresses.
      - key: PIXELINHA_ALLOWED_ORIGIN_REGEX
        value: https://pixelinha[a-z0-9-]*\.vercel\.app
      # The free plan has 512 MB of memory. A 12-megapixel photo peaks near 400 MB,
      # so larger images are refused with a clear message.
      - key: PIXELINHA_MAX_IMAGE_PIXELS
        value: "16000000"
